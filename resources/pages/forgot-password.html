<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">Recuperação</p>
        <h1>Esqueci minha senha</h1>
        <p class="lead">
          Informe o e-mail da conta. Se ele estiver cadastrado, enviaremos um código de 6 dígitos.
        </p>

        <p id="message" class="message" hidden></p>

        <form id="forgot-form">
          <label>
            E-mail
            <input type="email" name="email" autocomplete="email" required />
          </label>

          <div class="actions">
            <button class="button-primary" type="submit">Enviar código</button>
            <div class="links">
              <a href="/login.html">Voltar ao login</a>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script src="/js/app.js"></script>
    <script>
      const form = document.querySelector('#forgot-form');
      const message = document.querySelector('#message');
      const button = form.querySelector('button');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideMessage(message);
        setLoading(button, true);

        const data = Object.fromEntries(new FormData(form));

        try {
          const result = await api('/api/forgot-password', { method: 'POST', body: data });

          // Guardamos o e-mail para as próximas telas (validar código / nova senha).
          saveResetData({ email: data.email });

          showMessage(message, result.message, 'success');

          setTimeout(() => {
            window.location.href = '/verify-code.html';
          }, 1000);
        } catch (error) {
          showMessage(message, error.message, 'error');
        } finally {
          setLoading(button, false);
        }
      });
    </script>
  </body>
</html>
