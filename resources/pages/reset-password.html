<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova senha</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">Recuperação</p>
        <h1>Nova senha</h1>
        <p class="lead">Defina uma senha nova. Depois disso, o código OTP não poderá ser usado novamente.</p>

        <p id="message" class="message" hidden></p>

        <form id="reset-form">
          <label>
            Nova senha
            <input type="password" name="password" autocomplete="new-password" required minlength="6" />
          </label>

          <label>
            Confirmação da nova senha
            <input type="password" name="confirmPassword" autocomplete="new-password" required minlength="6" />
          </label>

          <div class="actions">
            <button class="button-primary" type="submit">Redefinir senha</button>
            <div class="links">
              <a href="/login.html">Voltar ao login</a>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script src="/js/app.js"></script>
    <script>
      const resetData = getResetData();

      if (!resetData.email || !resetData.code) {
        window.location.href = '/forgot-password.html';
      }

      const form = document.querySelector('#reset-form');
      const message = document.querySelector('#message');
      const button = form.querySelector('button');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideMessage(message);
        setLoading(button, true);

        const formData = Object.fromEntries(new FormData(form));

        try {
          const result = await api('/api/reset-password', {
            method: 'POST',
            body: {
              email: resetData.email,
              code: resetData.code,
              password: formData.password,
              confirmPassword: formData.confirmPassword,
            },
          });

          // O fluxo acabou: limpamos o e-mail/código guardados no navegador.
          clearResetData();
          showMessage(message, result.message, 'success');

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1200);
        } catch (error) {
          showMessage(message, error.message, 'error');
        } finally {
          setLoading(button, false);
        }
      });
    </script>
  </body>
</html>
